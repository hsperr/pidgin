[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidgin"
version = "0.1.0"
description = "Contract bridge bidding from self-play: grounding, own contract, then table score"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["training", "training.bridge", "training.contract", "training.fourseat", "training.play", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tools = ["dashboard.html"]
